name: build-twin

on:
  push:
    paths: ['twin/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          brew install ldid xz make || true
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build twin
        working-directory: twin
        run: |
          make clean || true
          make FINALPACKAGE=1

      - name: Collect
        run: |
          mkdir -p out
          find twin -name '*.dylib' -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: twin-dylib
          path: out/*.dylib
          if-no-files-found: error

name: build-cf-dump
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm xz-utils

      - name: iOS SDK
        run: |
          mkdir -p "$HOME/sdk" && cd "$HOME/sdk"
          curl -L --fail -o sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS15.6.sdk.tar.xz
          tar -xJf sdk.tar.xz
          ls -d "$HOME/sdk"/*.sdk

      - name: Build cf_dump.dylib
        run: |
          SDK=$(ls -d "$HOME"/sdk/*.sdk | head -1)
          echo "SDK=$SDK"
          clang++ -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -std=c++17 -O2 \
            -fuse-ld=lld \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-install_name,@executable_path/cf_dump.dylib \
            -framework Foundation -framework UIKit \
            cf_dump.mm -o cf_dump.dylib
          ls -lh cf_dump.dylib
          file cf_dump.dylib || true

      - uses: actions/upload-artifact@v4
        with:
          name: cf_dump
          path: cf_dump.dylib
          if-no-files-found: error
